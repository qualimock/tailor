name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  test-build:
    name: Test Build
    runs-on: alt-sisyphus

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y meson vala blueprint-compiler "pkgconfig(libadwaita-1)" gettext-tools

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        run: meson setup _build -Dprefix=/usr

      - name: Build
        run: ninja install -C _build
