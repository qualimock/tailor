name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  test-build:
    name: Test Build
    runs-on: als-huge

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y meson vala blueprint-compiler \
          'pkgconfig(libadwaita-1)' \
          'pkgconfig(libosinfo-1.0)' \
          'pkgconfig(gee-0.8)' \
          'pkgconfig(udisks2)' \
          'pkgconfig(libsoup-3.0)' \
          gettext-tools

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        run: meson setup _build -Dprefix=/usr

      - name: Build
        run: ninja install -C _build
