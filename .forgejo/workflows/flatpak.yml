name: Flatpak

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'COPYING'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'COPYING'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-build:
    name: Flatpak Build (${{ matrix.profile }})
    runs-on: als-huge
    timeout-minutes: 60

    strategy:
      matrix:
        profile: [stable, devel]
        include:
          - profile: stable
            manifest: build-aux/flatpak/org.altlinux.Tailor.json
            app_id: org.altlinux.Tailor
          - profile: devel
            manifest: build-aux/flatpak/org.altlinux.Tailor.Devel.json
            app_id: org.altlinux.Tailor.Devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.forgejo/workflows/flatpak.yml') }}

      - name: Install flatpak tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.cache/flatpak-builder
          key: flatpak-builder-${{ matrix.profile }}-${{ hashFiles(matrix.manifest) }}
          restore-keys: |
            flatpak-builder-${{ matrix.profile }}-

      - name: Build
        run: |
          flatpak-builder --repo=repo --force-clean builddir \
            ${{ matrix.manifest }}

      - name: Bundle flatpak
        run: |
          flatpak build-bundle repo ${{ matrix.app_id }}.flatpak \
            ${{ matrix.app_id }}

      - name: Upload flatpak bundle artifact
        uses: actions/upload-artifact@v3
        with:
          name: flatpak-bundle-${{ matrix.profile }}
          path: ${{ matrix.app_id }}.flatpak
          retention-days: 7
