name: CI

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'COPYING'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'COPYING'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-vala:
    name: Lint vala files
    runs-on: als-tiny
    timeout-minutes: 10
    container:
      image: altlinux.space/actions/runner/containers:sisyphus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y vala-lint

      - name: Lint files
        run: vala-lint -d src --config vala-lint.conf

  test-build:
    name: Test Build (${{ startsWith(github.ref, 'refs/tags/') && 'default' || 'development' }})
    runs-on: als-huge
    timeout-minutes: 30
    needs: lint-vala

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y meson vala blueprint-compiler \
          'pkgconfig(libadwaita-1)' \
          'pkgconfig(libosinfo-1.0)' \
          'pkgconfig(gee-0.8)' \
          'pkgconfig(udisks2)' \
          'pkgconfig(libsoup-3.0)' \
          gettext-tools

      - name: Setup
        run: meson setup _build -Dprefix=/usr -Dprofile=${{ startsWith(github.ref, 'refs/tags/') && 'default' || 'development' }}

      - name: Build
        run: ninja install -C _build

      - name: Test
        run: meson test -C _build

  release:
    name: Create release
    runs-on: als-huge
    timeout-minutes: 10
    needs: [lint-vala, test-build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          apt-get update
          apt-get install -y zstd bzip2

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Archive source
        run: |
          mkdir -p release-assets
          prefix="tailor-${{ steps.version.outputs.value }}"
          git archive --format=tar.gz --prefix="$prefix/" \
            -o "release-assets/$prefix.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$prefix/" \
            -o "release-assets/$prefix.zip" "$GITHUB_REF_NAME"
          git archive --format=tar --prefix="$prefix/" "$GITHUB_REF_NAME" \
            | zstd -o "release-assets/$prefix.tar.zst"
          git archive --format=tar --prefix="$prefix/" "$GITHUB_REF_NAME" \
            | bzip2 -c > "release-assets/$prefix.tar.bz2"

      - name: Attach release assets
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          title: Tailor ${{ steps.version.outputs.value }}
          release-notes-file: RELEASE_NOTES.md
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          release-dir: release-assets
          token: ${{ secrets.RELEASE_TOKEN }}
          sha: ${{ github.sha }}
          tag: ${{ github.ref_name }}
          override: true

  flatpak-devel:
    name: Flatpak Build (devel, nightly)
    runs-on: als-huge
    timeout-minutes: 60
    needs: [lint-vala, test-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.forgejo/workflows/ci.yml') }}

      - name: Install flatpak tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.cache/flatpak-builder
          key: flatpak-builder-devel-${{ hashFiles('build-aux/flatpak/org.altlinux.Tailor.Devel.json') }}
          restore-keys: |
            flatpak-builder-devel-

      - name: Build
        run: |
          flatpak-builder --repo=repo --force-clean builddir \
            build-aux/flatpak/org.altlinux.Tailor.Devel.json

      - name: Bundle flatpak
        run: |
          mkdir -p release-assets
          flatpak build-bundle repo release-assets/org.altlinux.Tailor.Devel.flatpak \
            org.altlinux.Tailor.Devel

      - name: Publish nightly pre-release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          title: Tailor nightly
          prerelease: true
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          release-dir: release-assets
          release-notes: "Nightly build from ${{ github.sha }}"
          token: ${{ secrets.RELEASE_TOKEN }}
          sha: ${{ github.sha }}
          tag: nightly
          override: true

      - name: Force prerelease flag (forgejo-release override PATCH bug)
        run: |
          release_id="$(curl -sSf -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/nightly" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          curl -sSf -X PATCH \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"prerelease": true}' \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$release_id"

  flatpak-test:
    name: Flatpak Test Build (devel)
    runs-on: als-huge
    timeout-minutes: 60
    needs: [lint-vala, test-build]
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.forgejo/workflows/ci.yml') }}

      - name: Install flatpak tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.cache/flatpak-builder
          key: flatpak-builder-devel-${{ hashFiles('build-aux/flatpak/org.altlinux.Tailor.Devel.json') }}
          restore-keys: |
            flatpak-builder-devel-

      - name: Build
        run: |
          flatpak-builder --repo=repo --force-clean builddir \
            build-aux/flatpak/org.altlinux.Tailor.Devel.json
