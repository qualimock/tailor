name: CI

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
    paths-ignore:
      - '**.md'
      - 'COPYING'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'COPYING'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-vala:
    name: Lint vala files
    runs-on: als-tiny
    timeout-minutes: 10
    container:
      image: altlinux.space/actions/runner/containers:sisyphus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y vala-lint

      - name: Lint files
        run: vala-lint -d src --config vala-lint.conf

  test-build:
    name: Test Build (${{ startsWith(github.ref, 'refs/tags/') && 'default' || 'development' }})
    runs-on: als-huge
    timeout-minutes: 30
    needs: lint-vala

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y meson vala blueprint-compiler \
          'pkgconfig(libadwaita-1)' \
          'pkgconfig(libosinfo-1.0)' \
          'pkgconfig(gee-0.8)' \
          'pkgconfig(udisks2)' \
          'pkgconfig(libsoup-3.0)' \
          gettext-tools

      - name: Setup
        run: meson setup _build -Dprefix=/usr -Dprofile=${{ startsWith(github.ref, 'refs/tags/') && 'default' || 'development' }}

      - name: Build
        run: ninja install -C _build

      - name: Test
        run: meson test -C _build

  flatpak-stable:
    name: Flatpak Build (stable)
    runs-on: als-huge
    timeout-minutes: 60
    needs: [lint-vala, test-build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.forgejo/workflows/ci.yml') }}

      - name: Install flatpak tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.cache/flatpak-builder
          key: flatpak-builder-stable-${{ hashFiles('build-aux/flatpak/org.altlinux.Tailor.json') }}
          restore-keys: |
            flatpak-builder-stable-

      - name: Build
        run: |
          flatpak-builder --repo=repo --force-clean builddir \
            build-aux/flatpak/org.altlinux.Tailor.json

      - name: Bundle flatpak
        run: |
          flatpak build-bundle repo org.altlinux.Tailor.flatpak \
            org.altlinux.Tailor

      - name: Upload flatpak bundle artifact
        uses: actions/upload-artifact@v3
        with:
          name: flatpak-bundle-stable
          path: org.altlinux.Tailor.flatpak
          retention-days: 7

  flatpak-devel:
    name: Flatpak Build (devel, nightly)
    runs-on: als-huge
    timeout-minutes: 60
    needs: [lint-vala, test-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.forgejo/workflows/ci.yml') }}

      - name: Install flatpak tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.cache/flatpak-builder
          key: flatpak-builder-devel-${{ hashFiles('build-aux/flatpak/org.altlinux.Tailor.Devel.json') }}
          restore-keys: |
            flatpak-builder-devel-

      - name: Build
        run: |
          flatpak-builder --repo=repo --force-clean builddir \
            build-aux/flatpak/org.altlinux.Tailor.Devel.json

      - name: Bundle flatpak
        run: |
          flatpak build-bundle repo org.altlinux.Tailor.Devel.flatpak \
            org.altlinux.Tailor.Devel

      - name: Upload flatpak bundle artifact
        uses: actions/upload-artifact@v3
        with:
          name: flatpak-bundle-devel
          path: org.altlinux.Tailor.Devel.flatpak
          retention-days: 7

  flatpak-test:
    name: Flatpak Test Build (devel)
    runs-on: als-huge
    timeout-minutes: 60
    needs: [lint-vala, test-build]
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.forgejo/workflows/ci.yml') }}

      - name: Install flatpak tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.cache/flatpak-builder
          key: flatpak-builder-devel-${{ hashFiles('build-aux/flatpak/org.altlinux.Tailor.Devel.json') }}
          restore-keys: |
            flatpak-builder-devel-

      - name: Build
        run: |
          flatpak-builder --repo=repo --force-clean builddir \
            build-aux/flatpak/org.altlinux.Tailor.Devel.json
